<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Camaleão - Cadastro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-size: border-box; font-size: 14px; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; border: none; border-radius: 4px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sistema Camaleão</h2>
    <form action="/sistema/cadastro" method="POST">
        <div class="campo">
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" required placeholder="Ex: camaleao_admin">
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>
        <div class="campo">
            <label for="senha">Senha (Mínimo 8 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="8" required placeholder="••••••••">
        </div>
        <button type="submit">Finalizar Cadastro</button>
    </form>
</div>

</body>
</html>
