<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Camaleão - Orçamentos Premium</title>
    <style>
        :root {
            --bg-principal: #121824;
            --bg-card: #1e2640;
            --bg-input: #141b2d;
            --texto-principal: #ffffff;
            --texto-secundario: #8a99ad;
            --accent-verde: #10b981;
            --accent-azul: #3b82f6;
            --accent-alerta: #ef4444;
            --borda: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
        }

        /* Barra de Navegação Unificada */
        .navbar-camaleao {
            background-color: var(--bg-card);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borda);
        }
        .navbar-logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-azul);
            text-decoration: none;
        }
        .navbar-menu {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            background-color: var(--bg-input);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid var(--borda);
        }
        .nav-btn:hover {
            background-color: var(--accent-azul);
        }
        .nav-btn.active {
            background-color: var(--accent-verde);
            border-color: var(--accent-verde);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card-sistema {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--borda);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .titulo-secao {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--accent-azul);
            border-bottom: 1px solid var(--borda);
            padding-bottom: 10px;
        }

        .grid-orcamento {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            color: var(--texto-secundario);
            margin-bottom: 6px;
        }

        input {
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-principal);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-azul);
        }

        .painel-resultado {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            border: 1px solid var(--borda);
        }

        .resultado-bloco {
            text-align: center;
            flex: 1;
        }

        .resultado-bloco span {
            display: block;
            font-size: 11px;
            color: var(--texto-secundario);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .resultado-bloco strong {
            font-size: 22px;
            font-weight: 600;
        }

        .valor-lucro {
            color: var(--accent-verde);
        }
    </style>
</head>
<body>

<!-- BARRA DE NAVEGAÇÃO -->
<nav class="navbar-camaleao">
    <a href="/sistema" class="navbar-logo">🦎 Sistema Camaleão</a>
    <div class="navbar-menu">
        <a href="/sistema" class="nav-btn">📊 Painel Principal</a>
        <a href="/sistema/registrar-obra" class="nav-btn">🛠️ Cadastrar Obra</a>
        <a href="/sistema/sistema" class="nav-btn active">💰 Calculador de Orçamento</a>
    </div>
</nav>

<div class="container">
    <div class="card-sistema">
        <div class="titulo-secao">📐 Calculador de Orçamentos e Custos Operacionais</div>
        
        <div class="grid-orcamento">
            <div class="campo-grupo">
                <label for="calc_mao_obra">Mão de Obra Pretendida (R$)</label>
                <input type="number" id="calc_mao_obra" step="0.01" placeholder="0,00" oninput="calcularOrcamentoGeral()">
            </div>
            <div class="campo-grupo">
                <label for="calc_materiais">Custo Total de Materiais (R$)</label>
                <input type="number" id="calc_materiais" step="0.01" placeholder="0,00" oninput="calcularOrcamentoGeral()">
            </div>
            <div class="campo-grupo">
                <label for="calc_deslocamento">Custos de Deslocamento/Frete (R$)</label>
                <input type="number" id="calc_deslocamento" step="0.01" placeholder="0,00" oninput="calcularOrcamentoGeral()">
            </div>
        </div>

        <!-- PAINEL OPERACIONAL INTEGRADO -->
        <div class="painel-resultado">
            <div class="resultado-bloco">
                <span>Custo de Execução</span>
                <strong id="res_custo_total" style="color: var(--accent-alerta);">R$ 0,00</strong>
            </div>
            <div class="resultado-bloco">
                <span>Preço Mínimo Sugerido</span>
                <strong id="res_preco_sugerido" style="color: var(--accent-azul);">R$ 0,00</strong>
            </div>
            <div class="resultado-bloco">
                <span>Margem de Lucro Real</span>
                <strong id="res_lucro_real" class="valor-lucro">R$ 0,00</strong>
            </div>
        </div>
    </div>
</div>

<script>
    function calcularOrcamentoGeral() {
        const maoObra = parseFloat(document.getElementById('calc_mao_obra').value) || 0;
        const materiais = parseFloat(document.getElementById('calc_materiais').value) || 0;
        const frete = parseFloat(document.getElementById('calc_deslocamento').value) || 0;

        const custoTotal = materiais + frete;
        const precoSugerido = maoObra + custoTotal;
        const lucroReal = precoSugerido - custoTotal;

        document.getElementById('res_custo_total').innerText = `R$ ${custoTotal.toFixed(2)}`;
        document.getElementById('res_preco_sugerido').innerText = `R$ ${precoSugerido.toFixed(2)}`;
        document.getElementById('res_lucro_real').innerText = `R$ ${lucroReal.toFixed(2)}`;
    }
</script>

</body>
</html>
