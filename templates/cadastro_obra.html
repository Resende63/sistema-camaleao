<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Camaleão - Gestão Corporativa de Obras</title>
    <style>
        :root {
            --bg-principal: #121824;
            --bg-card: #1e2640;
            --bg-input: #141b2d;
            --texto-principal: #ffffff;
            --texto-secundario: #8a99ad;
            --accent-verde: #10b981;
            --accent-alerta: #ef4444;
            --accent-azul: #3b82f6;
            --borda: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container-premium {
            width: 100%;
            max-width: 900px;
        }

        .header-sistema {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 15px;
        }

        .header-sistema h1 {
            font-size: 24px;
            margin: 0;
            color: var(--accent-azul);
            font-weight: 600;
        }

        .badge-premium {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-corporativo {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--borda);
        }

        .card-titulo {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--texto-principal);
            border-bottom: 1px solid var(--borda);
            padding-bottom: 10px;
        }

        .grid-formulario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
        }

        .campo-grupo.largo {
            grid-column: span 2;
        }

        label {
            font-size: 12px;
            color: var(--texto-secundario);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-principal);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-azul);
        }

        .btn-salvar {
            background-color: var(--accent-verde);
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-salvar:hover {
            background-color: #059669;
        }

        .btn-salvar:active {
            transform: scale(0.99);
        }

        .resumo-financeiro {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.15);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .resumo-item {
            text-align: center;
            flex: 1;
        }

        .resumo-item span {
            display: block;
            font-size: 11px;
            color: var(--texto-secundario);
            text-transform: uppercase;
        }

        .resumo-item strong {
            font-size: 18px;
            font-weight: 600;
        }

        .lucro-limpo {
            color: var(--accent-verde);
        }
    </style>
</head>
<body>

<div class="container-premium">
    <div class="header-sistema">
        <h1>🦎 Sistema Camaleão</h1>
        <span class="badge-premium">Enterprise Premium</span>
    </div>

    <form action="/sistema/registrar-obra" method="POST">
        <!-- BLOCO 1: CADASTRO DO CLIENTE -->
        <div class="card-corporativo">
            <div class="card-titulo">👤 Informações Corporativas do Cliente</div>
            <div class="grid-formulario">
                <div class="campo-grupo largo">
                    <label for="cliente_nome">Razão Social / Nome Completo</label>
                    <input type="text" id="cliente_nome" name="cliente_nome" required placeholder="Ex: Acme Corporações Ltda">
                </div>
                <div class="campo-grupo">
                    <label for="cliente_documento">CPF / CNPJ (Proteção de Identidade)</label>
                    <input type="text" id="cliente_documento" name="cliente_documento" placeholder="00.000.000/0001-00">
                </div>
                <div class="campo-grupo">
                    <label for="cliente_contato">Telefone corporativo / WhatsApp</label>
                    <input type="tel" id="cliente_contato" name="cliente_contato" required placeholder="(00) 99999-9999">
                </div>
            </div>
        </div>

        <!-- BLOCO 2: DETALHES DA PRESTAÇÃO DE SERVIÇO & PREVENÇÃO DE ESQUECIMENTO -->
        <div class="card-corporativo">
            <div class="card-titulo">🛠️ Especificações Técnicas e Lembrete Operacional</div>
            <div class="grid-formulario">
                <div class="campo-grupo largo">
                    <label for="obra_endereco">Local da Prestação do Serviço / Obra</label>
                    <input type="text" id="obra_endereco" name="obra_endereco" required placeholder="Endereço completo da empresa visitada">
                </div>
                <div class="campo-grupo">
                    <label for="data_orcamento">Data de Emissão do Orçamento</label>
                    <input type="date" id="data_orcamento" name="data_orcamento" required>
                </div>
                <div class="campo-grupo">
                    <label for="status_lembrete">Status do Lembrete de Cobrança</label>
                    <select id="status_lembrete" name="status_lembrete">
                        <option value="pendente">🔴 Pendente (Alertar em 3 dias)</option>
                        <option value="aprovado">🟢 Aprovado (Em Execução)</option>
                        <option value="finalizado">🔵 Finalizado e Quitado</option>
                    </select>
                </div>
                <div class="campo-grupo largo" style="grid-column: span 4;">
                    <label for="obra_descricao">Memorial Descritivo do que foi feito/gasto na empresa</label>
                    <textarea id="obra_descricao" name="obra_descricao" rows="4" placeholder="Descreva aqui detalhadamente: o que foi feito lá, o que comprou para a obra, materiais utilizados..."></textarea>
                </div>
            </div>
        </div>

        <!-- BLOCO 3: INTEGRAÇÃO FINANCEIRA AUTOMÁTICA -->
        <div class="card-corporativo">
            <div class="card-titulo">💰 Integração de Custos e Faturamento</div>
            <div class="grid-formulario">
                <div class="campo-grupo">
                    <label for="valor_faturamento">Preço de Venda / Orçado (R$)</label>
                    <input type="number" step="0.01" id="valor_faturamento" name="valor_faturamento" required placeholder="0,00" oninput="calcularLucro()">
                </div>
                <div class="campo-grupo">
                    <label for="valor_custo">Gasto de Material / Compras (R$)</label>
                    <input type="number" step="0.01" id="valor_custo" name="valor_custo" required placeholder="0,00" oninput="calcularLucro()">
                </div>
            </div>

            <!-- Demonstração de Resultados em Tempo Real -->
            <div class="resumo-financeiro">
                <div class="resumo-item">
                    <span>Faturamento Geral</span>
                    <strong id="resumo_fat">R$ 0,00</strong>
                </div>
                <div class="resumo-item">
                    <span>Custo Retido</span>
                    <strong id="resumo_custo" style="color: var(--accent-alerta);">R$ 0,00</strong>
                </div>
                <div class="resumo-item">
                    <span>Mapeamento de Lucro Limpo</span>
                    <strong id="resumo_lucro" class="lucro-limpo">R$ 0,00</strong>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-salvar">Garantir Registro Seguro na Nuvem</button>
    </form>
</div>

<script>
    function calcularLucro() {
        const fat = parseFloat(document.getElementById('valor_faturamento').value) || 0;
        const custo = parseFloat(document.getElementById('valor_custo').value) || 0;
        const lucro = fat - custo;

        document.getElementById('resumo_fat').innerText = `R$ ${fat.toFixed(2)}`;
        document.getElementById('resumo_custo').innerText = `R$ ${custo.toFixed(2)}`;
        document.getElementById('resumo_lucro').innerText = `R$ ${lucro.toFixed(2)}`;
        
        if (lucro < 0) {
            document.getElementById('resumo_lucro').style.color = 'var(--accent-alerta)';
        } else {
            document.getElementById('resumo_lucro').style.color = 'var(--accent-verde)';
        }
    }
    
    // Alinhamento exato para o calendário puxar a data correta
    window.onload = function() {
        document.getElementById('data_orcamento').value = new Date().toISOString().split('T')[0];
    }
</script>

</body>
</html>
